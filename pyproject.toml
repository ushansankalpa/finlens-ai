[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cdazzdev-mle-assessment"
version = "0.1.0"
description = "Spec-driven financial research, QLoRA, and agent workflow assessment"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "pydantic>=2.10,<3",
  "matplotlib>=3.9,<4", "requests>=2.32,<3", "yfinance>=0.2.65,<1",
  "feedparser>=6,<7", "langgraph>=1,<2", "duckduckgo-search>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
training = ["torch>=2.6,<3", "transformers>=4.51,<5", "jinja2>=3.1,<4", "peft>=0.15,<1", "accelerate>=1,<2", "bitsandbytes>=0.45,<1", "datasets>=3,<5", "rouge-score>=0.1.2,<1", "bert-score>=0.3.13,<1", "huggingface-hub>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["shared*", "task1_financial*", "task2_genai*", "task3_agentic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
